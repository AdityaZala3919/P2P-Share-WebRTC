requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

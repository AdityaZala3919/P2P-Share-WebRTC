<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CIPHERSHARE // End-to-End Encrypted P2P Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/landing.css">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: "#08090C",
              sidebar: "#0D0F14",
              card: "#131720",
              cardHover: "#181D28",
              border: "#1A202C",
              cyan: "#00FFFF",
              cyanHover: "#33FFFF",
              cyanDim: "rgba(0, 255, 255, 0.12)",
              green: "#00FF88",
              text: "#FFFFFF",
              muted: "#7E8B9B",
            }
          },
          fontFamily: {
            sans: ["\"Inter\"", "sans-serif"],
            mono: ["\"JetBrains Mono\"", "monospace"],
          }
        }
      }
    }
  </script>
</head>

<body class="text-app-text min-h-screen bg-app-bg flex flex-col font-sans selection:bg-app-cyan selection:text-black">

  <div class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <div class="w-full max-w-sm sm:max-w-md my-auto animate-fade-in">
      
      <!-- Brand & Header -->
      <div class="text-center mb-6 sm:mb-8">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-app-cyanDim border border-app-cyan/30 flex items-center justify-center text-app-cyan mx-auto mb-3 shadow-[0_0_20px_rgba(0,255,255,0.15)]">
          <i data-lucide="shield" class="w-7 h-7 sm:w-8 sm:h-8"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">CIPHERSHARE</h1>
        <p class="text-xs sm:text-sm text-app-muted mt-1 font-mono">
          End-to-end encrypted · Serverless P2P mesh
        </p>
      </div>

      <!-- Main Card -->
      <div class="bg-app-card border border-app-border rounded-2xl sm:rounded-3xl p-5 sm:p-7 shadow-2xl">
        
        <!-- Tab Switcher -->
        <div class="flex bg-app-sidebar rounded-xl p-1 mb-5">
          <button
            type="button"
            id="tab-create"
            class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer bg-app-cyan text-black shadow-sm"
          >
            Create Room
          </button>
          <button
            type="button"
            id="tab-join"
            class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer text-app-muted hover:text-white"
          >
            Join Room
          </button>
        </div>

        <!-- Form -->
        <form id="landing-form" class="space-y-3.5">
          
          <!-- Room Code (Shown only on Join) -->
          <div id="room-code-group" class="hidden">
            <label class="text-[11px] text-app-muted font-mono block mb-1.5 font-medium">ROOM CODE</label>
            <input
              type="text"
              id="input-room-code"
              placeholder="e.g. CYBER-7429"
              class="w-full bg-app-sidebar border border-app-border focus:border-app-cyan text-white text-sm font-mono rounded-xl px-4 py-3 outline-none transition-colors tracking-widest uppercase placeholder:normal-case placeholder:tracking-normal placeholder:text-app-muted/50"
              maxlength="12"
            />
          </div>

          <!-- Passphrase -->
          <div>
            <label class="text-[11px] text-app-muted font-mono block mb-1.5 font-medium">PASSPHRASE</label>
            <input
              type="password"
              id="input-passphrase"
              placeholder="Enter private room passphrase..."
              class="w-full bg-app-sidebar border border-app-border focus:border-app-cyan text-white text-sm rounded-xl px-4 py-3 outline-none transition-colors placeholder:text-app-muted/50"
              autocomplete="new-password"
              required
            />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="btn-submit"
            class="w-full py-3 bg-app-cyan hover:bg-app-cyanHover disabled:opacity-40 disabled:hover:bg-app-cyan text-black font-bold text-sm rounded-xl transition-all mt-2 cursor-pointer shadow-md shadow-cyan-950/20 active:scale-[0.99] disabled:cursor-not-allowed flex items-center justify-center gap-2"
          >
            <span id="btn-submit-text">Create Encrypted Room</span>
          </button>
        </form>
      </div>

      <p class="text-center text-[10px] sm:text-[11px] text-app-muted font-mono mt-5">
        🔒 Zero logs · Direct WebRTC DataChannels · AES-256 Vault
      </p>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-app-card border border-app-cyan/50 px-4 py-2.5 rounded-full text-xs font-mono text-white flex items-center space-x-2 shadow-xl">
      <span class="w-1.5 h-1.5 rounded-full bg-app-cyan"></span>
      <span id="toast-msg">Notification</span>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>

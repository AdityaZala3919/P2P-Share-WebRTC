<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CIPHERSHARE // End-to-End Encrypted P2P Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsQR Library for live camera scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/landing.css">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            app: {
              bg: "#08090C",
              sidebar: "#0D0F14",
              card: "#131720",
              cardHover: "#181D28",
              border: "#1A202C",
              cyan: "#00FFFF",
              cyanHover: "#33FFFF",
              cyanDim: "rgba(0, 255, 255, 0.12)",
              green: "#00FF88",
              text: "#FFFFFF",
              muted: "#7E8B9B",
            }
          },
          fontFamily: {
            sans: ["\"Inter\"", "sans-serif"],
            mono: ["\"JetBrains Mono\"", "monospace"]
          }
        }
      }
    };
  </script>
</head>

<body class="bg-app-bg text-app-text min-h-screen flex flex-col items-center justify-center p-4 selection:bg-app-cyan selection:text-black font-sans relative overflow-x-hidden">

  <!-- Ambient Background Glow -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] sm:w-[500px] h-[350px] sm:h-[500px] bg-app-cyan/5 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Container -->
  <div class="w-full max-w-[420px] flex flex-col items-center">
    
    <!-- Branding Header -->
    <div class="flex items-center space-x-2.5 mb-2">
      <div class="w-9 h-9 rounded-xl bg-app-cyanDim border border-app-cyan/40 flex items-center justify-center text-app-cyan shadow-lg shadow-cyan-950/40">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white font-mono">CIPHERSHARE</h1>
    </div>
    
    <p class="text-xs sm:text-sm text-app-muted mb-6 text-center">
      Peer-to-Peer Encrypted Transfer & Vault
    </p>

    <!-- Card Wrapper -->
    <div class="w-full">
      <!-- Main Card -->
      <div class="bg-app-card border border-app-border rounded-2xl sm:rounded-3xl p-5 sm:p-7 shadow-2xl">
        
        <!-- Tab Switcher -->
        <div class="flex bg-app-sidebar rounded-xl p-1 mb-5">
          <button
            type="button"
            id="tab-create"
            class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer bg-app-cyan text-black shadow-sm"
          >
            Create Room
          </button>
          <button
            type="button"
            id="tab-join"
            class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all cursor-pointer text-app-muted hover:text-white"
          >
            Join Room
          </button>
        </div>

        <!-- Form -->
        <form id="landing-form" class="space-y-3.5">
          
          <!-- Room Code (Shown only on Join) -->
          <div id="room-code-group" class="hidden">
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-[11px] text-app-muted font-mono font-medium">ROOM CODE (5-CHARS)</label>
              <button
                type="button"
                id="btn-scan-qr"
                class="text-[11px] font-mono text-app-cyan hover:text-app-cyanHover hover:underline flex items-center gap-1 cursor-pointer transition-colors"
                title="Scan QR code using camera"
              >
                <i data-lucide="camera" class="w-3.5 h-3.5"></i> Live Camera QR
              </button>
            </div>
            <input
              type="text"
              id="input-room-code"
              placeholder="e.g. a2xa7"
              class="w-full bg-app-sidebar border border-app-border focus:border-app-cyan text-white text-sm font-mono rounded-xl px-4 py-3 outline-none transition-colors tracking-widest lowercase placeholder:normal-case placeholder:tracking-normal placeholder:text-app-muted/50"
              maxlength="5"
              pattern="[a-z0-9]{5}"
            />
          </div>

          <!-- Passphrase -->
          <div>
            <label class="text-[11px] text-app-muted font-mono block mb-1.5 font-medium">PASSPHRASE</label>
            <input
              type="password"
              id="input-passphrase"
              placeholder="Enter private room passphrase..."
              class="w-full bg-app-sidebar border border-app-border focus:border-app-cyan text-white text-sm rounded-xl px-4 py-3 outline-none transition-colors placeholder:text-app-muted/50"
              autocomplete="new-password"
              required
            />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="btn-submit"
            class="w-full py-3 bg-app-cyan hover:bg-app-cyanHover disabled:opacity-40 disabled:hover:bg-app-cyan text-black font-bold text-sm rounded-xl transition-all mt-2 cursor-pointer shadow-md shadow-cyan-950/20 active:scale-[0.99] disabled:cursor-not-allowed flex items-center justify-center gap-2"
          >
            <span id="btn-submit-text">Create Encrypted Room</span>
          </button>
        </form>
      </div>

      <p class="text-center text-[10px] sm:text-[11px] text-app-muted font-mono mt-5">
        🔒 Zero logs · Direct WebRTC DataChannels · AES-256 Vault
      </p>

    </div>
  </div>

  <!-- Live Camera QR Scanner Modal -->
  <div id="qr-scanner-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="bg-app-card border border-app-border rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in relative flex flex-col">
      <div class="flex items-center justify-between p-3.5 border-b border-app-border bg-app-sidebar/70">
        <div class="flex items-center gap-2">
          <i data-lucide="camera" class="w-4 h-4 text-app-cyan"></i>
          <h3 class="text-xs font-semibold text-white font-mono uppercase tracking-wider">Live Camera QR Scanner</h3>
        </div>
        <button id="btn-close-scanner" type="button" class="text-app-muted hover:text-white p-1 rounded-lg transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <div class="relative bg-black aspect-square w-full flex items-center justify-center overflow-hidden">
        <video id="qr-video" class="w-full h-full object-cover" playsinline autoplay muted></video>
        <canvas id="qr-canvas" class="hidden"></canvas>
        
        <!-- Scanner targeting box overlay -->
        <div class="absolute inset-10 border-2 border-app-cyan/70 rounded-2xl pointer-events-none flex items-center justify-center shadow-lg shadow-cyan-950/50">
          <div class="w-full h-0.5 bg-app-cyan/90 absolute shadow-sm shadow-app-cyan animate-pulse"></div>
        </div>
        
        <div id="scanner-loading" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center gap-2 text-xs font-mono text-app-muted">
          <i data-lucide="loader-2" class="w-6 h-6 text-app-cyan animate-spin"></i>
          <span>Starting Camera...</span>
        </div>
      </div>
      
      <div class="p-3 text-center border-t border-app-border bg-app-sidebar/50">
        <p class="text-[11px] font-mono text-app-muted">Point camera at another device's Pair QR code</p>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-app-card border border-app-cyan/50 px-4 py-2.5 rounded-full text-xs font-mono text-white flex items-center space-x-2 shadow-xl">
      <span class="w-1.5 h-1.5 rounded-full bg-app-cyan"></span>
      <span id="toast-msg">Notification</span>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>
